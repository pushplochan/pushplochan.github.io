<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Repositories | pushplochan</title>
    <meta
      name="description"
      content="Explore all public repositories by pushplochan, showcasing projects, experiments, and open-source work."
    />
    <style>
      :root {
        --bg: #07111f;
        --bg-alt: #0d1728;
        --panel: rgba(15, 23, 42, 0.88);
        --panel-soft: rgba(15, 23, 42, 0.64);
        --line: rgba(148, 163, 184, 0.18);
        --text: #e5eefb;
        --muted: #9aaec7;
        --primary: #7c9cff;
        --primary-2: #8b5cf6;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 15%, rgba(124, 156, 255, 0.22), transparent 25%),
          radial-gradient(circle at 80% 10%, rgba(139, 92, 246, 0.2), transparent 25%),
          linear-gradient(180deg, #040b14 0%, #091521 38%, #07111f 100%);
        line-height: 1.6;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 0 12px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        box-shadow: 0 12px 24px rgba(124, 156, 255, 0.38);
      }

      .github-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 600;
        border: 1px solid rgba(148, 163, 184, 0.26);
        background: rgba(15, 23, 42, 0.7);
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .github-btn:hover {
        border-color: rgba(124, 156, 255, 0.5);
        transform: translateY(-1px);
      }

      .hero {
        padding: 42px 0 28px;
      }

      .eyebrow {
        display: inline-block;
        padding: 7px 12px;
        border: 1px solid rgba(124, 156, 255, 0.28);
        border-radius: 999px;
        background: rgba(124, 156, 255, 0.08);
        color: #b9c9ff;
        font-size: 0.76rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 14px;
        font-size: clamp(2.5rem, 5vw, 5rem);
        line-height: 1;
        letter-spacing: -0.06em;
      }

      .lead {
        max-width: 720px;
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 1.06rem;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        margin-bottom: 28px;
      }

      .stat {
        min-width: 150px;
        padding: 18px 20px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(8px);
      }

      .stat strong {
        display: block;
        font-size: clamp(1.5rem, 3vw, 2.3rem);
        line-height: 1.2;
        margin-bottom: 4px;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .search-wrap {
        position: relative;
        flex: 1 1 360px;
        max-width: 480px;
      }

      .search-wrap svg {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.75;
      }

      .search-wrap input {
        width: 100%;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.68);
        color: var(--text);
        border-radius: 14px;
        padding: 14px 18px 14px 48px;
        font: inherit;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .search-wrap input:focus {
        border-color: rgba(124, 156, 255, 0.8);
        box-shadow: 0 0 0 3px rgba(124, 156, 255, 0.18);
      }

      .repo-section {
        padding: 18px 0 80px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }

      .section-header h2 {
        margin: 0;
        font-size: clamp(1.3rem, 2vw, 2rem);
        letter-spacing: -0.04em;
      }

      .repo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
        gap: 22px;
      }

      .repo-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 250px;
        padding: 20px 18px 18px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.78), rgba(11, 17, 29, 0.9));
        box-shadow: var(--shadow);
        overflow: hidden;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .repo-card::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, var(--primary), var(--primary-2));
      }

      .repo-card:hover {
        transform: translateY(-4px);
        border-color: rgba(124, 156, 255, 0.4);
      }

      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .repo-name {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 1.05rem;
        min-width: 0;
      }

      .repo-name a {
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
      }

      .repo-icon {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 10px;
        background: rgba(124, 156, 255, 0.1);
        color: #dfe8ff;
        font-size: 0.85rem;
      }

      .visibility {
        border: 1px solid rgba(52, 211, 153, 0.3);
        background: rgba(52, 211, 153, 0.08);
        color: #aef7d7;
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 0.7rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .description {
        margin: 0;
        color: var(--muted);
        min-height: 72px;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 0.78rem;
        color: #dfeafc;
      }

      .lang-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
        flex-shrink: 0;
      }

      .topics {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 38px;
      }

      .topic {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(139, 92, 246, 0.12);
        border: 1px solid rgba(139, 92, 246, 0.2);
        color: #cfc5ff;
        font-size: 0.72rem;
      }

      .card-footer {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(148, 163, 184, 0.12);
        color: var(--muted);
        font-size: 0.8rem;
      }

      .view-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(124, 156, 255, 0.16), rgba(139, 92, 246, 0.12));
        border: 1px solid rgba(124, 156, 255, 0.2);
        color: #dfe8ff;
        font-weight: 600;
      }

      .empty-state {
        padding: 28px 18px;
        border: 1px dashed rgba(148, 163, 184, 0.28);
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.4);
        color: var(--muted);
        text-align: center;
      }

      .loading-state {
        padding: 20px 18px;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(148, 163, 184, 0.12);
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .topbar {
          padding-top: 20px;
        }

        .topbar .brand {
          font-size: 0.95rem;
        }

        .github-btn {
          padding: 9px 14px;
          font-size: 0.9rem;
        }

        .card-footer {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand" aria-label="pushplochan brand">
          <span class="brand-mark">P</span>
          <span>pushplochan</span>
        </div>

        <a class="github-btn" href="https://github.com/pushplochan" target="_blank" rel="noopener noreferrer">
          GitHub profile
        </a>
      </header>

      <main>
        <section class="hero">
          <div class="eyebrow">Developer portfolio</div>
          <h1>Public repositories</h1>
          <p class="lead">
            A collection of open-source projects, experiments, tools, and ideas built and shared publicly.
          </p>

          <div class="stats" aria-label="Repository statistics">
            <div class="stat">
              <strong id="repoCount">0</strong>
              <span>Total public repos</span>
            </div>
            <div class="stat">
              <strong id="starCount">0</strong>
              <span>Stars earned</span>
            </div>
            <div class="stat">
              <strong id="forkCount">0</strong>
              <span>Forks</span>
            </div>
          </div>

          <div class="toolbar">
            <label class="search-wrap" aria-label="Search repositories">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Zm0 0 9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input id="searchInput" type="search" placeholder="Search repositories..." />
            </label>
          </div>
        </section>

        <section class="repo-section">
          <div class="section-header">
            <h2>Repository collection</h2>
          </div>

          <div id="loadingState" class="loading-state">Loading public repositories...</div>
          <div id="repoGrid" class="repo-grid" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script>
      const username = 'pushplochan';
      const repoGrid = document.getElementById('repoGrid');
      const loadingState = document.getElementById('loadingState');
      const searchInput = document.getElementById('searchInput');
      const repoCount = document.getElementById('repoCount');
      const starCount = document.getElementById('starCount');
      const forkCount = document.getElementById('forkCount');

      const repoList = [];

      function formatNumber(value) {
        return new Intl.NumberFormat('en-US').format(value || 0);
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function languageColor(lang) {
        const palette = {
          JavaScript: '#f1e05a',
          TypeScript: '#3178c6',
          Python: '#3572A5',
          HTML: '#e34c26',
          CSS: '#563d7c',
          Java: '#b07219',
          C: '#555555',
          'C++': '#f34b7d',
          'C#': '#178600',
          Go: '#00ADD8',
          Rust: '#dea584',
          PHP: '#4F5D95',
          Ruby: '#701516',
          Shell: '#89e051',
          Swift: '#F05138',
          Vue: '#41b883',
          React: '#61dafb',
          Dockerfile: '#384d54',
          Docker: '#384d54',
          Markdown: '#083fa1',
          null: '#94a3b8',
          default: '#a78bfa'
        };

        return palette[lang] || palette.default;
      }

      function renderRepoCard(repo) {
        const description = escapeHtml(repo.description || 'No description provided yet.');
        const topics = (repo.topics || []).slice(0, 4);
        const language = repo.language || 'No language';
        const updated = new Date(repo.updated_at).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });

        return `
          <article class="repo-card">
            <div class="card-top">
              <div class="repo-name">
                <span class="repo-icon">◈</span>
                <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer">${escapeHtml(repo.name)}</a>
              </div>
              <span class="visibility">${repo.private ? 'Private' : 'Public'}</span>
            </div>

            <p class="description">${description}</p>

            <div class="meta-row">
              <span class="pill">
                <span class="lang-dot" style="background:${languageColor(language)}"></span>
                ${escapeHtml(language)}
              </span>
              <span class="pill">★ ${formatNumber(repo.stargazers_count)}</span>
              <span class="pill">⎇ ${formatNumber(repo.forks_count)}</span>
            </div>

            <div class="topics">
              ${topics.length
                ? topics.map((topic) => `<span class="topic">${escapeHtml(topic)}</span>`).join('')
                : '<span class="topic">General</span>'}
            </div>

            <div class="card-footer">
              <span>Updated ${updated}</span>
              <a class="view-link" href="${repo.html_url}" target="_blank" rel="noopener noreferrer">View</a>
            </div>
          </article>
        `;
      }

      function renderRepos(repos) {
        if (!repos.length) {
          repoGrid.innerHTML = '<div class="empty-state">No repositories match your search.</div>';
          return;
        }

        repoGrid.innerHTML = repos.map(renderRepoCard).join('');
      }

      function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();
        const filtered = repoList.filter((repo) => {
          const haystack = [
            repo.name,
            repo.description || '',
            repo.language || '',
            ...(repo.topics || [])
          ]
            .join(' ')
            .toLowerCase();

          return haystack.includes(query);
        });

        repoCount.textContent = formatNumber(filtered.length);
        renderRepos(filtered);
      }

      async function fetchRepositories() {
        try {
          const response = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`);

          if (!response.ok) {
            throw new Error('Unable to fetch repository data.');
          }

          const repos = await response.json();
          const publicRepos = repos.filter((repo) => !repo.private).sort((a, b) => {
            const score = (b.stargazers_count + b.forks_count) - (a.stargazers_count + a.forks_count);
            return score || new Date(b.updated_at) - new Date(a.updated_at);
          });

          repoList.push(...publicRepos);

          const totalStars = publicRepos.reduce((sum, repo) => sum + (repo.stargazers_count || 0), 0);
          const totalForks = publicRepos.reduce((sum, repo) => sum + (repo.forks_count || 0), 0);

          repoCount.textContent = formatNumber(publicRepos.length);
          starCount.textContent = formatNumber(totalStars);
          forkCount.textContent = formatNumber(totalForks);

          loadingState.style.display = 'none';
          renderRepos(publicRepos);
        } catch (error) {
          loadingState.textContent = 'GitHub API could not be reached right now. Please refresh the page or view the repository list on GitHub.';
          repoGrid.innerHTML = '<div class="empty-state">We could not load repository information from GitHub at this time.</div>';
        }
      }

      searchInput.addEventListener('input', applyFilters);
      fetchRepositories();
    </script>
  </body>
</html>
